<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--card:#1e2436;--card2:#161b27;--border:#2a3147;
  --accent:#6c8ef5;--accent2:#a78bfa;--green:#34d399;--yellow:#fbbf24;
  --red:#f87171;--text:#e2e8f0;--muted:#8892a4;--code:#1a2035;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 60px}
header{background:linear-gradient(135deg,#1e2a4a,#2d1b4e);border:1px solid var(--border);border-radius:16px;padding:32px;margin-bottom:24px}
header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--muted);font-size:14px;margin-top:6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:10px 18px;background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.tab:hover{color:var(--text);border-color:var(--accent)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:20px}
.toolbar button{padding:8px 16px;background:var(--code);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.toolbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar button.primary:hover{background:#5577e8;color:#fff}
.toolbar .spacer{flex:1}
.score-pill{background:var(--code);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600}
.score-pill .n{color:var(--green)}
.q{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px;transition:.2s}
.q.correct{border-color:var(--green);background:rgba(52,211,153,.05)}
.q.wrong{border-color:var(--red);background:rgba(248,113,113,.05)}
.q-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.q-num{flex-shrink:0;background:var(--code);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--accent)}
.q-text{font-size:15px;font-weight:600;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:var(--code);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s;font-size:14px}
.opt:hover{border-color:var(--accent)}
.opt.selected{border-color:var(--accent);background:rgba(108,142,245,.1)}
.opt.right{border-color:var(--green);background:rgba(52,211,153,.1);color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(248,113,113,.1);color:var(--red)}
.opt input{accent-color:var(--accent);margin-top:4px}
.opt .letter{font-weight:700;color:var(--accent);min-width:18px}
.opt.right .letter{color:var(--green)}
.opt.wrong .letter{color:var(--red)}
.explain{display:none;margin-top:12px;padding:12px 14px;background:rgba(108,142,245,.08);border-left:3px solid var(--accent);border-radius:6px;font-size:13px;color:var(--muted)}
.explain.show{display:block}
.explain b{color:var(--accent)}
.result-banner{display:none;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:24px;text-align:center;margin-bottom:20px}
.result-banner.show{display:block}
.result-banner h2{font-size:24px;margin-bottom:8px}
.result-banner .pct{font-size:42px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-banner p{color:var(--muted);font-size:14px;margin-top:6px}
.pages{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.page-btn{padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px}
.page-btn:hover{color:var(--text)}
.page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
@media(max-width:700px){
  .wrap{padding:14px}
  header{padding:20px}
  header h1{font-size:22px}
  .toolbar{padding:12px}
}
</style>

let currentChapter = 'L5';
let userAnswers = {};
let order = {};

function init(){
  Object.keys(QUIZ).forEach(k => {
    userAnswers[k] = new Array(QUIZ[k].questions.length).fill(null);
    order[k] = QUIZ[k].questions.map((_,i)=>i);
  });
  renderTabs();
  renderChapter('L5');
  bindToolbar();
}

function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  Object.keys(QUIZ).forEach(k => {
    const b = document.createElement('div');
    b.className = 'tab' + (k===currentChapter?' active':'');
    b.textContent = QUIZ[k].title;
    b.onclick = () => { currentChapter = k; renderTabs(); renderChapter(k); };
    t.appendChild(b);
  });
}

function renderChapter(k){
  const chap = QUIZ[k];
  const c = document.getElementById('quiz-container');
  document.getElementById('total').textContent = chap.questions.length;
  document.getElementById('score').textContent = currentScore(k);
  document.getElementById('banner').classList.remove('show');
  c.innerHTML = '';
  order[k].forEach((qi, displayIdx) => {
    const q = chap.questions[qi];
    const div = document.createElement('div');
    div.className = 'q';
    div.id = `q-${k}-${qi}`;
    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `<div class="q-num">${displayIdx+1}/${chap.questions.length}</div><div class="q-text">${escapeHtml(q.q)}</div>`;
    div.appendChild(head);
    const opts = document.createElement('div');
    opts.className = 'opts';
    const letters = ['A','B','C','D','E','F'];
    q.o.forEach((opt, oi) => {
      const lab = document.createElement('label');
      lab.className = 'opt';
      lab.innerHTML = `<input type="radio" name="q-${k}-${qi}" value="${oi}"><span class="letter">${letters[oi]}.</span><span>${escapeHtml(opt)}</span>`;
      const input = lab.querySelector('input');
      if (userAnswers[k][qi] === oi) { input.checked = true; lab.classList.add('selected'); }
      input.onchange = () => {
        userAnswers[k][qi] = oi;
        opts.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
        lab.classList.add('selected');
        document.getElementById('score').textContent = currentScore(k);
      };
      opts.appendChild(lab);
    });
    div.appendChild(opts);
    const ex = document.createElement('div');
    ex.className = 'explain';
    ex.innerHTML = `<b>เฉลย:</b> ${letters[q.a]}. ${escapeHtml(q.o[q.a])} — ${escapeHtml(q.e || '')}`;
    div.appendChild(ex);
    c.appendChild(div);
  });
}

function currentScore(k){
  let s = 0;
  QUIZ[k].questions.forEach((q,i)=>{ if (userAnswers[k][i]===q.a) s++; });
  return s;
}

function checkAnswers(){
  const k = currentChapter;
  const chap = QUIZ[k];
  let correct = 0;
  chap.questions.forEach((q, qi) => {
    const div = document.getElementById(`q-${k}-${qi}`);
    if (!div) return;
    const opts = div.querySelectorAll('.opt');
    opts.forEach(o => o.classList.remove('right','wrong'));
    const ans = userAnswers[k][qi];
    if (ans === q.a) { correct++; div.classList.add('correct'); div.classList.remove('wrong'); }
    else if (ans !== null) { div.classList.add('wrong'); div.classList.remove('correct'); }
    if (ans !== null) {
      opts[q.a].classList.add('right');
      if (ans !== q.a) opts[ans].classList.add('wrong');
    }
    div.querySelector('.explain').classList.add('show');
  });
  const total = chap.questions.length;
  const pct = Math.round(correct/total*100);
  const b = document.getElementById('banner');
  b.classList.add('show');
  document.getElementById('banner-title').textContent = `ผลคะแนน ${chap.title}`;
  document.getElementById('banner-pct').textContent = `${correct}/${total}  (${pct}%)`;
  let msg = '';
  if (pct === 100) msg = 'เต็ม! แม่นทุกข้อ';
  else if (pct >= 80) msg = 'เก่ง พร้อมสอบ';
  else if (pct >= 60) msg = 'ผ่าน อ่านทบทวนข้อที่ผิด';
  else if (pct >= 40) msg = 'พอใช้ ทบทวนเพิ่ม';
  else msg = 'อ่านเนื้อหาก่อนแล้วลองใหม่';
  document.getElementById('banner-msg').textContent = msg;
  document.getElementById('score').textContent = correct;
  window.scrollTo({top:0, behavior:'smooth'});
}

function showAnswers(){
  const k = currentChapter;
  document.querySelectorAll(`#quiz-container .explain`).forEach(e => e.classList.add('show'));
  QUIZ[k].questions.forEach((q, qi) => {
    const div = document.getElementById(`q-${k}-${qi}`);
    if (!div) return;
    const opts = div.querySelectorAll('.opt');
    opts[q.a].classList.add('right');
  });
}

function shuffle(){
  const k = currentChapter;
  order[k] = QUIZ[k].questions.map((_,i)=>i).sort(()=>Math.random()-0.5);
  renderChapter(k);
}

function resetChapter(){
  const k = currentChapter;
  userAnswers[k] = new Array(QUIZ[k].questions.length).fill(null);
  order[k] = QUIZ[k].questions.map((_,i)=>i);
  renderChapter(k);
}

function bindToolbar(){
  document.getElementById('btn-check').onclick = checkAnswers;
  document.getElementById('btn-show').onclick = showAnswers;
  document.getElementById('btn-shuffle').onclick = shuffle;
  document.getElementById('btn-reset').onclick = resetChapter;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

init();
